<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fa;
    }

    .header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #2f3542;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ced4da;
    }

    .status-dot.recording {
      background: #ff4757;
      box-shadow: 0 0 5px #ff4757;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0.5;
      }
    }

    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .start-btn {
      background: #2ed573;
      color: white;
    }

    .start-btn:hover {
      background: #26af5f;
    }

    .stop-btn {
      background: #ff4757;
      color: white;
      display: none;
    }

    .stop-btn:hover {
      background: #ff1f32;
    }

    .export-btn {
      background: #1e90ff;
      color: white;
      display: none;
    }

    .export-btn:hover {
      background: #0077e6;
    }

    .steps-info {
      font-size: 12px;
      color: #747d8c;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="header">
    <div id="statusDot" class="status-dot"></div>
    Scribe Clone v1.7
  </div>

  <button id="startBtn" class="start-btn">Start Recording</button>
  <button id="stopBtn" class="stop-btn">Stop Recording</button>
  <button id="exportBtn" class="export-btn">Download for VitePress</button>

  <div id="stepsCount" class="steps-info">0 steps captured</div>

  <script src="jszip.min.js"></script>
  <script src="popup.js"></script>
</body>

</html>
